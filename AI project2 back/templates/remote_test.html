<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页 - ANP智能化运维平台</title>
    <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/develop.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-diagram-3 me-2"></i>
                ANP智能化运维平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/chat">聊天</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/topology">网络拓扑</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/develop">开发页面</a>
                    </li>
                </ul>

                <div class="navbar-nav ms-auto">
                    <div class="nav-item dropdown" id="userSection" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            <span id="currentUsername">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/profile">
                                <i class="fas fa-user me-2"></i>个人资料
                            </a></li>
                            <li><a class="dropdown-item" href="/api/settings"><i class="fas fa-cog me-2"></i>用户设置</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">
                                <i class="fas fa-sign-out-alt me-2"></i>退出登录
                            </a></li>
                        </ul>
                    </div>
                    <div class="nav-item" id="authSection">
                        <a class="nav-link" href="/login">
                            <i class="fas fa-sign-in-alt me-1"></i>登录
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="bi bi-wifi me-2"></i>测试页</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <h5 class="alert-heading"><i class="bi bi-info-circle me-2"></i>ANP智能化运维平台</h5>
                            <hr>
                            <p class="mb-2">欢迎使用 ANP 智能化运维平台远程测试功能</p>
                            <p class="mb-2">本平台提供设备远程管理与监控服务</p>
                            <p class="mb-2">支持多种网络设备的统一管控</p>
                            <p class="mb-0">实时监控设备状态，保障网络稳定运行</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap-5.1.3.bundle.min.js') }}"></script>
    <script src="/static/js/main.js"></script>
    <script>
        function checkAuthentication() {
            const token = localStorage.getItem('auth_token');
            const user = localStorage.getItem('user_info');

            if (!token || !user) {
                window.location.href = '/login';
                return false;
            }

            try {
                const userData = JSON.parse(user);
                document.getElementById('currentUsername').textContent = userData.username || '用户';
                return true;
            } catch (error) {
                console.error('解析用户数据失败:', error);
                window.location.href = '/login';
                return false;
            }
        }

        async function logout() {
            try {
                await fetch('/auth/logout', {
                    method: 'GET',
                    credentials: 'include'
                });
            } catch (error) {
                console.error('登出请求失败:', error);
            } finally {
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user_info');
                window.location.href = '/login';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (checkAuthentication()) {
                const userSection = document.getElementById('userSection');
                const authSection = document.getElementById('authSection');
                if (userSection && authSection) {
                    userSection.style.display = 'block';
                    authSection.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
