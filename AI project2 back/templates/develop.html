<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDK 开发 - ANP 智能化运维平台</title>
    <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/vendor/codemirror/codemirror.css" rel="stylesheet">
    <link href="/static/vendor/codemirror/monokai.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/develop.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-diagram-3 me-2"></i>
                ANP 智能化运维平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="/chat">聊天</a></li>
                    <li class="nav-item"><a class="nav-link" href="/topology">网络拓扑</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/develop">开发页面</a></li>
                </ul>
                <div class="navbar-nav ms-auto">
                    <div class="nav-item dropdown" id="userSection" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i>
                            <span id="currentUsername">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/api/settings">用户设置</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </div>
                    <div class="nav-item" id="authSection">
                        <a class="nav-link" href="/login">
                            <i class="bi bi-box-arrow-in-right me-1"></i>登录
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid h-100">
        <div class="row h-100">
            <div class="col-md-3 sidebar">
                <div class="sidebar-header">
                    <h5><i class="bi bi-code-slash me-2"></i>SDK 开发环境</h5>
                </div>

                <div class="device-types mb-3">
                    <h6><i class="bi bi-server me-2"></i>支持的设备</h6>
                    <div id="deviceTypes" class="device-list"></div>
                </div>

                <div class="code-examples">
                    <h6><i class="bi bi-book me-2"></i>示例代码</h6>
                    <div class="example-list">
                        <button class="btn btn-sm btn-outline-primary w-100 mb-2" onclick="loadExample('basic')">
                            <i class="bi bi-play me-1"></i>基础操作
                        </button>
                        <button class="btn btn-sm btn-outline-info w-100 mb-2" onclick="loadExample('config')">
                            <i class="bi bi-gear me-1"></i>配置设备
                        </button>
                        <button class="btn btn-sm btn-outline-success w-100 mb-2" onclick="loadExample('monitor')">
                            <i class="bi bi-graph-up me-1"></i>状态监控
                        </button>
                        <button class="btn btn-sm btn-outline-warning w-100 mb-2" onclick="loadExample('batch')">
                            <i class="bi bi-layers me-1"></i>批量操作
                        </button>
                    </div>
                </div>

                <div class="api-docs">
                    <h6><i class="bi bi-book-half me-2"></i>API 提示</h6>
                    <div class="accordion" id="apiAccordion">
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#deviceAPI">
                                    设备管理
                                </button>
                            </h2>
                            <div id="deviceAPI" class="accordion-collapse collapse" data-bs-parent="#apiAccordion">
                                <div class="accordion-body">
                                    <small>
                                        <code>network_manager.add_device()</code><br>
                                        <code>network_manager.remove_device()</code><br>
                                        <code>network_manager.get_network_status()</code>
                                    </small>
                                </div>
                            </div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#configAPI">
                                    配置管理
                                </button>
                            </h2>
                            <div id="configAPI" class="accordion-collapse collapse" data-bs-parent="#apiAccordion">
                                <div class="accordion-body">
                                    <small>
                                        <code>device.execute_command()</code><br>
                                        <code>device.get_status()</code><br>
                                        <code>device.connect()</code>
                                    </small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-9 main-content">
                <div class="development-area">
                    <div class="toolbar">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <div class="toolbar-left d-flex flex-wrap gap-2">
                                <button class="btn btn-success" id="runButton" onclick="runCode()">
                                    <i class="bi bi-play me-1"></i>运行代码
                                </button>
                                <button class="btn btn-outline-secondary" id="clearButton" onclick="clearCode()">
                                    <i class="bi bi-trash me-1"></i>清空编辑器
                                </button>
                                <button class="btn btn-outline-info" id="formatButton" onclick="formatCode()">
                                    <i class="bi bi-magic me-1"></i>格式化
                                </button>
                                <button class="btn btn-outline-primary" id="saveButton" onclick="saveCode()">
                                    <i class="bi bi-download me-1"></i>导出代码
                                </button>
                                <button class="btn btn-outline-dark" id="loadButton" onclick="loadCode()">
                                    <i class="bi bi-upload me-1"></i>导入代码
                                </button>
                            </div>
                            <div class="toolbar-right d-flex align-items-center gap-2">
                                <span class="badge bg-secondary" id="codeStatus">就绪</span>
                                <span class="badge bg-light text-dark" id="executionTime">0ms</span>
                            </div>
                        </div>
                    </div>

                    <div class="code-editor">
                        <textarea id="codeEditor"></textarea>
                    </div>

                    <div class="output-area">
                        <div class="output-header">
                            <h6><i class="bi bi-terminal me-2"></i>执行结果</h6>
                            <button class="btn btn-sm btn-outline-secondary" onclick="clearOutput()">
                                <i class="bi bi-x me-1"></i>清空输出
                            </button>
                        </div>
                        <div class="output-content" id="outputContent">
                            <div class="output-placeholder">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap-5.1.3.bundle.min.js') }}"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/vendor/codemirror/codemirror.min.js"></script>
    <script src="{{ url_for('static', filename='vendor/codemirror/mode/python/python.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/codemirror/addon/edit/closebrackets.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/codemirror/addon/edit/matchbrackets.min.js') }}"></script>
    <script src="/static/js/develop.js"></script>

    <script>
        function checkAuthentication() {
            const token = localStorage.getItem('auth_token');
            const user = localStorage.getItem('user_info');

            if (!token || !user) {
                window.location.href = '/login';
                return false;
            }

            try {
                const userData = JSON.parse(user);
                document.getElementById('currentUsername').textContent = userData.username || '用户';
                return true;
            } catch (error) {
                console.error('解析用户数据失败:', error);
                window.location.href = '/login';
                return false;
            }
        }

        async function logout() {
            try {
                await fetch('/auth/logout', {
                    method: 'GET',
                    credentials: 'include'
                });
            } catch (error) {
                console.error('登出请求失败:', error);
            } finally {
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user_info');
                window.location.href = '/login';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (checkAuthentication()) {
                const userSection = document.getElementById('userSection');
                const authSection = document.getElementById('authSection');
                if (userSection && authSection) {
                    userSection.style.display = 'block';
                    authSection.style.display = 'none';
                }
            }

            setTimeout(() => {
                window.developmentManager?.refreshEditor();
            }, 300);
        });
    </script>
</body>
</html>
